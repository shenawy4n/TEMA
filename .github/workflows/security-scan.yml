name: TEMA Security & Verification Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks across full Git history and working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: 'false'

  verify-build-and-security-tests:
    name: TypeScript, Functions Build, Rules Lint & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install and build Cloud Functions
        run: npm --prefix functions ci && npm --prefix functions run build

      - name: Type check frontend and Express server
        run: npm run lint

      - name: Lint Firestore security rules
        run: npm run lint:rules

      - name: Build frontend bundle
        run: npm run build

      - name: Run automated backend & bundle security tests
        run: npm test
